<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Toronto Simulator · Analytics</title>
<style>
  :root {
    --bg: #070a14; --panel: #0e1424; --panel2: #121a2e; --line: #1e2a44;
    --ink: #e7ecf7; --dim: #8f9bbd; --faint: #647099;
    --teal: #4bd8c4; --blue: #3fb8ff; --violet: #8b63ff; --pink: #ff4d9d;
    --amber: #ffb648; --red: #ff5a52; --good: #46d98b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    -webkit-font-smoothing: antialiased;
    background-image: radial-gradient(1200px 600px at 70% -10%, rgba(63,184,255,0.08), transparent 60%);
  }
  a { color: var(--blue); }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 28px 20px 80px; }
  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 4px; }
  h1 { font-size: 18px; letter-spacing: 3px; margin: 0; font-weight: 700; }
  h1 b { color: var(--teal); }
  .meta { color: var(--dim); font-size: 12px; }
  .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 18px 0 26px; }
  input, select, button {
    font: inherit; color: var(--ink); background: var(--panel2);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px;
  }
  input { width: 240px; }
  button { cursor: pointer; background: var(--teal); color: #042; border-color: transparent; font-weight: 700; }
  button:hover { filter: brightness(1.08); }
  button.ghost { background: var(--panel2); color: var(--ink); font-weight: 400; }
  .err { color: var(--red); font-size: 13px; }

  .grid { display: grid; gap: 14px; }
  .kpis { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-bottom: 20px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
  .kpi .v { font-size: 30px; font-weight: 700; letter-spacing: 0.5px; line-height: 1.1; }
  .kpi .l { color: var(--dim); font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; margin-top: 6px; }
  .kpi .sub { color: var(--faint); font-size: 11px; margin-top: 3px; }
  .kpi.human .v { color: var(--teal); }
  .kpi.bot .v { color: var(--amber); }
  .kpi.games .v { color: var(--blue); }

  .cols { grid-template-columns: 1.2fr 1fr; align-items: start; }
  @media (max-width: 820px) { .cols { grid-template-columns: 1fr; } }
  h2 { font-size: 12px; letter-spacing: 2px; color: var(--dim); text-transform: uppercase; margin: 0 0 14px; font-weight: 600; }

  /* funnel */
  .funnel { display: grid; gap: 9px; }
  .frow { display: grid; grid-template-columns: 110px 1fr 86px; align-items: center; gap: 10px; }
  .frow .fl { color: var(--dim); font-size: 12px; }
  .track { background: var(--panel2); border-radius: 7px; height: 26px; overflow: hidden; position: relative; }
  .fill { height: 100%; border-radius: 7px; display: flex; align-items: center; padding-left: 10px;
          color: #04121a; font-weight: 700; font-size: 12px; min-width: 2px; transition: width .5s; white-space: nowrap; }
  .frow .pct { text-align: right; color: var(--faint); font-size: 12px; }

  /* lists */
  .list { display: grid; gap: 2px; }
  .li { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 7px 0; border-bottom: 1px solid rgba(30,42,68,0.5); align-items: center; }
  .li:last-child { border-bottom: 0; }
  .li .n { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .li .c { color: var(--teal); font-weight: 700; }
  .li .mini { height: 5px; background: var(--blue); border-radius: 3px; grid-column: 1 / -1; opacity: .5; }
  .empty { color: var(--faint); font-size: 12px; padding: 8px 0; }

  /* timeseries */
  .ts { display: flex; align-items: flex-end; gap: 6px; height: 150px; padding-top: 8px; }
  .tsday { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; min-width: 0; }
  .tsbar { width: 100%; border-radius: 3px 3px 0 0; }
  .tsbar.h { background: var(--teal); }
  .tsbar.b { background: rgba(255,182,72,0.5); }
  .tslabel { text-align: center; color: var(--faint); font-size: 10px; margin-top: 6px; white-space: nowrap; }
  .legend { display: flex; gap: 16px; margin-top: 10px; color: var(--dim); font-size: 12px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 6px; vertical-align: middle; }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid rgba(30,42,68,0.6); white-space: nowrap; }
  th { color: var(--dim); font-weight: 600; letter-spacing: 1px; }
  td.bot { color: var(--amber); } td.human { color: var(--teal); }
  .scrollx { overflow-x: auto; }
  .tag { font-size: 10px; padding: 1px 7px; border-radius: 20px; border: 1px solid var(--line); color: var(--dim); }
  .hide { display: none; }
  .note { color: var(--faint); font-size: 11px; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>TORONTO SIMULATOR · <b>ANALYTICS</b></h1>
    <span class="meta" id="meta"></span>
  </header>

  <div class="bar">
    <input id="key" type="password" placeholder="admin key" autocomplete="off" />
    <select id="days">
      <option value="1">24 hours</option>
      <option value="7">7 days</option>
      <option value="14" selected>14 days</option>
      <option value="30">30 days</option>
      <option value="90">90 days</option>
    </select>
    <button id="go">Load</button>
    <button id="refresh" class="ghost hide">Refresh</button>
    <span class="err" id="err"></span>
  </div>

  <main id="out" class="hide">
    <div class="grid kpis" id="kpis"></div>

    <div class="grid cols" style="margin-bottom:14px">
      <div class="card">
        <h2>Human funnel</h2>
        <div class="funnel" id="funnel"></div>
        <div class="note" id="funnel-note"></div>
      </div>
      <div class="card">
        <h2>Games played</h2>
        <div class="grid kpis" id="gamekpis" style="grid-template-columns:repeat(2,1fr);gap:10px"></div>
      </div>
    </div>

    <div class="grid cols" style="margin-bottom:14px">
      <div class="card">
        <h2>Traffic over time <span class="tag">page views</span></h2>
        <div class="ts" id="ts"></div>
        <div class="legend">
          <span><i class="dot" style="background:var(--teal)"></i>humans</span>
          <span><i class="dot" style="background:rgba(255,182,72,0.5)"></i>bots</span>
        </div>
      </div>
      <div class="card">
        <h2>Where humans come from</h2>
        <div class="list" id="refs"></div>
      </div>
    </div>

    <div class="grid cols" style="margin-bottom:14px">
      <div class="card">
        <h2>Countries</h2>
        <div class="list" id="countries"></div>
      </div>
      <div class="card">
        <h2>Devices</h2>
        <div class="list" id="devices"></div>
      </div>
    </div>

    <div class="card" style="margin-bottom:14px">
      <h2>Top bot signatures <span class="tag">by distinct session</span></h2>
      <div class="list" id="bots"></div>
    </div>

    <div class="card">
      <h2>Recent events</h2>
      <div class="scrollx">
        <table id="recent"><thead><tr>
          <th>time</th><th>event</th><th>who</th><th>country</th><th>device</th><th>score</th><th>wave</th>
        </tr></thead><tbody></tbody></table>
      </div>
    </div>
  </main>
</div>

<script>
const $ = (s) => document.querySelector(s);
const keyEl = $('#key'), daysEl = $('#days');
const SAVED = 'ts_admin_key';
try { keyEl.value = localStorage.getItem(SAVED) || ''; } catch {}

const nf = (n) => (n ?? 0).toLocaleString();
const pct = (a, b) => (b > 0 ? Math.round((a / b) * 100) : 0);
const esc = (s) => String(s ?? '').replace(/[<>&]/g, (c) => ({ '<':'&lt;','>':'&gt;','&':'&amp;' }[c]));

async function load() {
  const key = keyEl.value.trim();
  const days = daysEl.value;
  $('#err').textContent = '';
  try {
    const url = '/api/stats?days=' + days + (key ? '&key=' + encodeURIComponent(key) : '');
    const r = await fetch(url, { credentials: 'same-origin' });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
    try { localStorage.setItem(SAVED, key); } catch {}
    render(data);
    $('#out').classList.remove('hide');
    $('#refresh').classList.remove('hide');
  } catch (e) {
    $('#err').textContent = e.message || 'failed';
  }
}

function kpi(cls, v, l, sub) {
  return `<div class="card kpi ${cls}"><div class="v">${v}</div><div class="l">${l}</div>${sub ? `<div class="sub">${sub}</div>` : ''}</div>`;
}

function render(d) {
  const pv = d.pageviews, vis = d.visitors, f = d.funnel, g = d.games || {};
  const botShare = pct(pv.bot, pv.total);
  $('#meta').textContent = `last ${d.days} days · generated ${new Date(d.generatedAt).toLocaleString()}`;

  $('#kpis').innerHTML = [
    kpi('human', nf(vis.human), 'Human visitors', `${nf(pv.human)} page views`),
    kpi('bot', nf(vis.bot), 'Bot visitors', `${nf(pv.bot)} hits · ${botShare}% of traffic`),
    kpi('games', nf(g.n), 'Games finished', `avg ${nf(g.avg_score)} · best ${nf(g.max_score)}`),
    kpi('', pct(f.played, f.visitors) + '%', 'Play rate', `${nf(f.played)} of ${nf(f.visitors)} started`),
    kpi('', pct(f.signedUp, f.visitors) + '%', 'Signup rate', `${nf(f.signedUp)} accounts`),
  ].join('');

  // funnel
  const steps = [
    ['Visited', f.visitors, 'var(--teal)'],
    ['Started a game', f.played, 'var(--blue)'],
    ['Finished a game', f.finishedGame, 'var(--violet)'],
    ['Signed up', f.signedUp, 'var(--pink)'],
  ];
  const top = Math.max(1, f.visitors);
  $('#funnel').innerHTML = steps.map(([label, val, col]) => {
    const w = Math.max(2, (val / top) * 100);
    return `<div class="frow"><span class="fl">${label}</span>
      <div class="track"><div class="fill" style="width:${w}%;background:${col}">${nf(val)}</div></div>
      <span class="pct">${pct(val, top)}%</span></div>`;
  }).join('');
  $('#funnel-note').textContent = `${nf(f.bounced)} visitors left without starting a game.`;

  $('#gamekpis').innerHTML = [
    kpi('', nf(g.n), 'Runs'),
    kpi('', nf(g.avg_score), 'Avg yutes'),
    kpi('', nf(g.max_score), 'Best run'),
    kpi('', g.avg_wave ?? 0, 'Avg wave'),
  ].join('');

  // timeseries
  const daily = d.daily || [];
  const peak = Math.max(1, ...daily.map((x) => x.human + x.bot));
  $('#ts').innerHTML = daily.length ? daily.map((x) => {
    const date = new Date(x.day * 86400000);
    const lbl = (date.getMonth() + 1) + '/' + date.getDate();
    const h = (x.human / peak) * 130, b = (x.bot / peak) * 130;
    return `<div class="tsday" title="${lbl} · ${x.human} human / ${x.bot} bot">
      <div class="tsbar b" style="height:${b}px"></div>
      <div class="tsbar h" style="height:${h}px"></div>
      <div class="tslabel">${lbl}</div></div>`;
  }).join('') : '<div class="empty">no page views yet</div>';

  listInto('#refs', d.referrers, (x) => [x.ref, x.n]);
  listInto('#countries', d.countries, (x) => [flag(x.country) + ' ' + x.country, x.n]);
  listInto('#devices', d.devices, (x) => [x.device, x.n]);
  listInto('#bots', d.topBots, (x) => [x.ua, x.n]);

  const tb = $('#recent tbody');
  tb.innerHTML = (d.recent || []).map((e) => `<tr>
    <td>${new Date(e.ts).toLocaleString()}</td>
    <td>${esc(e.type)}</td>
    <td class="${e.is_bot ? 'bot' : 'human'}">${e.is_bot ? 'bot' : 'human'}</td>
    <td>${esc(e.country || '')}</td>
    <td>${esc(e.device || '')}</td>
    <td>${e.score ?? ''}</td>
    <td>${e.wave ?? ''}</td></tr>`).join('') || '<tr><td colspan="7" class="empty">nothing yet</td></tr>';
}

function listInto(sel, arr, map) {
  const el = $(sel);
  if (!arr || !arr.length) { el.innerHTML = '<div class="empty">—</div>'; return; }
  const top = Math.max(...arr.map((x) => map(x)[1]), 1);
  el.innerHTML = arr.map((x) => {
    const [name, n] = map(x);
    return `<div class="li"><span class="n">${esc(name)}</span><span class="c">${nf(n)}</span>
      <span class="mini" style="width:${Math.max(4, (n / top) * 100)}%"></span></div>`;
  }).join('');
}

// Minimal ISO-3166 alpha-2 → emoji flag (regional indicators). '??' falls through blank.
function flag(cc) {
  if (!cc || cc.length !== 2 || /[^A-Za-z]/.test(cc)) return '🏴';
  return String.fromCodePoint(...[...cc.toUpperCase()].map((c) => 0x1f1e6 + c.charCodeAt(0) - 65));
}

$('#go').addEventListener('click', load);
$('#refresh').addEventListener('click', load);
keyEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') load(); });
daysEl.addEventListener('change', () => { if (!$('#out').classList.contains('hide')) load(); });
</script>
</body>
</html>
